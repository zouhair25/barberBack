<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <title>Facture</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 12px; color: #333; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; margin-bottom: 30px; }
        .shop-name { font-size: 24px; font-weight: bold; color: #1a1a2e; }
        .invoice-title { font-size: 28px; color: #e94560; text-align: right; }
        .invoice-meta { text-align: right; color: #666; }
        .parties { display: flex; justify-content: space-between; margin-bottom: 25px; }
        .party-box { width: 45%; }
        .party-box h4 { background: #1a1a2e; color: white; padding: 6px 10px; margin: 0 0 8px 0; border-radius: 3px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        thead tr { background: #1a1a2e; color: white; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; }
        td.right, th.right { text-align: right; }
        .totals { text-align: right; margin-top: 10px; }
        .totals table { width: 250px; margin-left: auto; }
        .totals .total-row { font-weight: bold; font-size: 14px; background: #1a1a2e; color: white; }
        .footer { margin-top: 40px; text-align: center; color: #999; font-size: 10px; border-top: 1px solid #eee; padding-top: 10px; }
        .badge { display: inline-block; background: #e94560; color: white; padding: 2px 8px; border-radius: 10px; font-size: 10px; }
    </style>
</head>
<body>

<div class="header">
    <div>
        <div class="shop-name" th:text="${barber.shopName}">Barbershop</div>
        <div th:text="${barber.address}"></div>
        <div th:text="${barber.city}"></div>
        <div th:text="${barber.phone}"></div>
    </div>
    <div>
        <div class="invoice-title">FACTURE</div>
        <div class="invoice-meta">
            <div><strong>N° </strong><span th:text="${invoice.invoiceNumber}"></span></div>
            <div><strong>Date: </strong><span th:text="${#temporals.format(invoice.issuedAt, 'dd/MM/yyyy HH:mm')}"></span></div>
        </div>
    </div>
</div>

<div class="parties">
    <div class="party-box">
        <h4>Salon</h4>
        <div th:text="${barber.shopName}"></div>
        <div th:text="${barber.address}"></div>
        <div th:text="${barber.phone}"></div>
    </div>
    <div class="party-box">
        <h4>Client</h4>
        <div th:text="${client.firstName + ' ' + client.lastName}"></div>
        <div th:text="${client.email}"></div>
        <div th:text="${client.phone}"></div>
    </div>
</div>

<table>
    <thead>
        <tr>
            <th>Type</th>
            <th>Désignation</th>
            <th class="right">Qté</th>
            <th class="right">Prix unit.</th>
            <th class="right">Total</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="line : ${lines}">
            <td>
                <span class="badge" th:text="${line.lineType == 'SERVICE' ? 'Service' : 'Produit'}"></span>
            </td>
            <td th:text="${line.label}"></td>
            <td class="right" th:text="${line.quantity}"></td>
            <td class="right" th:text="${#numbers.formatDecimal(line.unitPrice, 1, 2) + ' MAD'}"></td>
            <td class="right" th:text="${#numbers.formatDecimal(line.totalPrice, 1, 2) + ' MAD'}"></td>
        </tr>
    </tbody>
</table>

<div class="totals">
    <table>
        <tr>
            <td>Sous-total</td>
            <td class="right" th:text="${#numbers.formatDecimal(invoice.subtotal, 1, 2) + ' MAD'}"></td>
        </tr>
        <tr th:if="${invoice.taxRate > 0}">
            <td th:text="'TVA (' + invoice.taxRate + '%)'"></td>
            <td class="right" th:text="${#numbers.formatDecimal(invoice.taxAmount, 1, 2) + ' MAD'}"></td>
        </tr>
        <tr class="total-row">
            <td><strong>TOTAL</strong></td>
            <td class="right"><strong th:text="${#numbers.formatDecimal(invoice.total, 1, 2) + ' MAD'}"></strong></td>
        </tr>
    </table>
</div>

<div th:if="${invoice.notes}" style="margin-top:20px; padding:10px; background:#f9f9f9; border-radius:5px;">
    <strong>Notes:</strong> <span th:text="${invoice.notes}"></span>
</div>

<div class="footer">
    Merci de votre visite! &bull; <span th:text="${barber.shopName}"></span>
    <br/>Ce document est une facture officielle.
</div>

</body>
</html>
