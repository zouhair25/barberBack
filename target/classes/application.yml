spring:
  application:
    name: barbershop-api

  datasource:
    url: jdbc:postgresql://localhost:5432/barbershop
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  cache:
    type: simple

server:
  port: 8080
  servlet:
    context-path: /api/v1

app:
  jwt:
    secret: ${JWT_SECRET:YourSuperSecretKeyForBarbershopAppThatIsLongEnough256Bits!}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000

  storage:
    base-path: ${STORAGE_PATH:./uploads}

  reminders:
    hours-before: 2
    check-interval-ms: 900000

  twilio:
    account-sid: ${TWILIO_SID:}
    auth-token: ${TWILIO_TOKEN:}
    from-number: ${TWILIO_FROM:}
    whatsapp-from: ${TWILIO_WA_FROM:}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
